name: Latest Substack posts

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC (09:00 Turkey time)
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://engincanveske.substack.com/feed"
          max_post_count: 5